version: "2"

run:
  timeout: 10m
  build-tags:
    - integration
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - forbidigo
    - gocheckcompilerdirectives
    - gosec
    - gocritic
    - iface
    - lll
    - makezero
    - modernize
    - musttag
    - nilnesserr
    - nilnil
    - noctx
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - thelper
    - unparam
    - unconvert
    - unqueryvet
    - usetesting
    - usestdlibvars
    - wastedassign
  settings:
    exhaustive:
      # slog.Kind switches are partial by design, a ReplaceAttr handler rewrites two kinds
      ignore-types:
        - ^log/slog\.Kind$
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    lll:
      line-length: 110
      tab-width: 1
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
    rules:
      - path: internal/outbox/relay_test.go
        source: runRelay\(
        linters:
          - thelper

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
